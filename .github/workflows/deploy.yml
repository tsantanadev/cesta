name: Deploy

# dev: every push to main that passed CI builds the image, runs migrations, deploys.
# prod: run this workflow by hand with the digest that ran in dev (ADR-0005).
# GCP access is OIDC only (Workload Identity Federation). The GitHub environments hold
# non-secret variables from `terraform output github_variables` (infra/README.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      digest:
        description: Image digest that ran in dev (sha256:...)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'prod' || 'dev' }}
  cancel-in-progress: false

env:
  REGION: southamerica-east1
  FIREBASE_TOOLS_VERSION: 15.37.0

jobs:
  dev:
    name: deploy dev
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://cesta-dev.tsantana.dev/health
    env:
      PUBLIC_URL: https://cesta-dev.tsantana.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push the image
        id: image
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --build-arg "VERSION=${SHA}" --label "org.opencontainers.image.revision=${SHA}" \
            -t "${IMAGE_REPOSITORY}:${SHA}" backend
          docker push "${IMAGE_REPOSITORY}:${SHA}"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_REPOSITORY}:${SHA}")
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image: \`${ref}\`. Promote to prod with digest \`${ref#*@}\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Run migrations
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          gcloud run jobs update cesta-migrate --region "$REGION" --image "$IMAGE" --quiet
          gcloud run jobs execute cesta-migrate --region "$REGION" --wait
      - name: Deploy the backend
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: gcloud run deploy cesta-backend --region "$REGION" --image "$IMAGE" --quiet
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Deploy Firebase Hosting
        working-directory: hosting
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy --only hosting --project "$PROJECT" --non-interactive
      - name: Smoke test
        run: .github/scripts/smoke-test.sh "$PUBLIC_URL"

  prod:
    name: promote to prod
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://cesta.tsantana.dev/health
    env:
      PUBLIC_URL: https://cesta.tsantana.dev
    steps:
      - name: Check the digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest must look like sha256:<64 hex characters>, got '${DIGEST}'"
            exit 1
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Hosting config and the smoke test must come from the commit the image was built
      # from, not from whatever main is now.
      - name: Find the image's commit
        id: revision
        env:
          DIGEST: ${{ inputs.digest }}
          SOURCE: ${{ vars.DEV_IMAGE_REPOSITORY }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          # .Image is the config for a single manifest, or a map by platform for an index.
          sha=$(docker buildx imagetools inspect "${SOURCE}@${DIGEST}" --format '{{json .Image}}' |
            jq -r 'if has("config") then . else .["linux/amd64"] end
                   | .config.Labels["org.opencontainers.image.revision"] // ""')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image has no org.opencontainers.image.revision label (got '${sha}')"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Promoting \`${DIGEST}\` built from ${sha}." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      # Same digest that ran in dev, copied into prod's registry, so prod keeps working
      # if dev's billing is ever detached.
      - name: Copy the image from dev
        id: image
        env:
          DIGEST: ${{ inputs.digest }}
          SOURCE: ${{ vars.DEV_IMAGE_REPOSITORY }}
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: |
          tag="${IMAGE_REPOSITORY}:promoted-${DIGEST:7:12}"
          docker buildx imagetools create --tag "$tag" "${SOURCE}@${DIGEST}"
          copied=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [[ "$copied" != "$DIGEST" ]]; then
            echo "::error::copied image has digest ${copied}, want ${DIGEST}"
            exit 1
          fi
          echo "ref=${IMAGE_REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Run migrations
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          gcloud run jobs update cesta-migrate --region "$REGION" --image "$IMAGE" --quiet
          gcloud run jobs execute cesta-migrate --region "$REGION" --wait
      - name: Deploy the backend
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: gcloud run deploy cesta-backend --region "$REGION" --image "$IMAGE" --quiet
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Deploy Firebase Hosting
        working-directory: hosting
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy --only hosting --project "$PROJECT" --non-interactive
      - name: Smoke test
        run: .github/scripts/smoke-test.sh "$PUBLIC_URL"
