name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        run: make generate-check
      - name: Lint
        run: make lint
      - name: Vulnerability check (govulncheck)
        run: make vuln
      - name: Test (incl. Seam 1, Postgres via testcontainers)
        run: make test

  kill-switch:
    name: kill-switch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/functions/billing-kill-switch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: infra/functions/billing-kill-switch/go.mod # what the go126 runtime builds with
          cache-dependency-path: infra/functions/billing-kill-switch/go.sum
      - name: Lint (backend's config and golangci-lint version)
        run: |
          version=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' ../../../backend/Makefile)
          go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${version}" run --config ../../../backend/.golangci.yaml ./...
      - name: Test
        run: go test -race -count=1 ./...

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate dev and prod
        run: |
          for env in dev prod; do
            terraform -chdir="envs/${env}" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="envs/${env}" validate
          done

  hosting:
    name: hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Deep-link files and Hosting config
        run: node --test 'hosting/test/*.test.mjs'

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generated code is up to date (API client, l10n, Drift)
        run: tool/codegen.sh --check
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test (incl. Seam 2)
        run: flutter test

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Go and Dart dependencies (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=backend/go.mod
            --lockfile=infra/functions/billing-kill-switch/go.mod
            --lockfile=app/pubspec.lock
