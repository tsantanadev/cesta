version: "2"

run:
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
    - usestdlibvars
  settings:
    sloglint:
      attr-only: true
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go|internal/testkit/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tsantanadev/cesta
