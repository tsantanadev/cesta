# Generates server types and routing from the API contract (api/openapi.yaml).
package: httpapi
output: openapi.gen.go
generate:
  std-http-server: true
  strict-server: true
  models: true
  embedded-spec: true
output-options:
  # Optional nullable fields become nullable.Nullable, so a mutation can tell
  # "clear this field" (null) from "leave it alone" (absent).
  nullable-type: true
