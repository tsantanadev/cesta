# Local dev: `make dev` brings up Postgres, applies migrations and runs the backend on :8080.
services:
  postgres:
    image: postgres:18-alpine # keep in step with internal/testkit/postgres.go
    environment:
      POSTGRES_USER: cesta
      POSTGRES_PASSWORD: cesta
      POSTGRES_DB: cesta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql # postgres 18+ keeps data in a versioned subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cesta -d cesta"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://cesta:cesta@postgres:5432/cesta?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: .
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://cesta:cesta@postgres:5432/cesta?sslmode=disable
      PORT: "8080"
      LOG_LEVEL: debug
      # Tokens from the app's dev build verify against the dev Firebase project.
      FIREBASE_PROJECT_ID: cesta-dev
      # Invitation emails: with RESEND_API_KEY unset they're only logged, which
      # EMAIL_LOG_ONLY allows (without it the backend won't start). Export these in
      # your shell to send through Resend (EMAIL_FROM unset: Cesta <convites@cesta.tsantana.dev>).
      EMAIL_LOG_ONLY: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Uncomment to export traces and metrics to a local OTLP collector:
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
