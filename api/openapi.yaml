openapi: 3.0.3
info:
  title: Cesta API
  version: 0.1.0
  description: Source of truth for the Cesta REST/JSON API. The Dart client is generated from this document.
servers:
  - url: http://localhost:8080
security:
  - firebaseIdToken: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database readiness
      security: []
      responses:
        "200":
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/me:
    get:
      operationId: getMe
      summary: The signed-in User
      description: >-
        Returns the User behind the bearer token. The first valid request from a new
        identity creates the User, with a suggested display name taken from the
        identity provider (or the email address) and displayNameConfirmed false.
      responses:
        "200":
          description: The signed-in User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: updateMe
      summary: Set the signed-in User's display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/lists:
    get:
      operationId: listLists
      summary: The Lists the signed-in User is a Member of
      description: >-
        Every List the User owns or was shared with, except deleted ones, with the
        User's Role and how many unchecked Items each has. Newest first.
      responses:
        "200":
          description: The User's Lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSummaries"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createList
      summary: Create a List owned by the signed-in User
      description: >-
        The client picks the List's ID, so a retried request is safe: sending an ID
        the User already owns returns that List with 200 and changes nothing. The
        User who created the List becomes its Owner. A User can own at most the
        configured limit of Lists that are not deleted (default 100).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListCreate"
      responses:
        "200":
          description: The List already existed with this ID (a retried request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSummary"
        "201":
          description: The new List
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/lists/{listId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
    patch:
      operationId: renameList
      summary: Rename a List (Owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListRename"
      responses:
        "200":
          description: The renamed List
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteList
      summary: Delete a List (Owner only)
      description: >-
        The List disappears for every Member at once. The Owner can restore it for
        30 days; after that it is purged. Deleting a List that is already deleted
        returns it unchanged.
      responses:
        "200":
          description: The deleted List, with when it will be purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/lists/{listId}/restore:
    parameters:
      - $ref: "#/components/parameters/ListId"
    post:
      operationId: restoreList
      summary: Restore a deleted List (Owner only, within 30 days)
      description: >-
        Brings the List back for every Member. Restoring a List that isn't deleted
        changes nothing. Restoring counts towards the Owner's List limit.
      responses:
        "200":
          description: The restored List
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/deleted-lists:
    get:
      operationId: listDeletedLists
      summary: Lists the signed-in User deleted and can still restore
      description: Only Lists the User owns, deleted less than 30 days ago. Most recently deleted first.
      responses:
        "200":
          description: The User's recently deleted Lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedLists"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/sync/push:
    post:
      operationId: pushMutations
      summary: Apply a batch of the device's outbox mutations
      description: >-
        Mutations are applied in order. Each one is idempotent by its client mutation
        ID: pushing a mutation the server already received returns its original result
        and changes nothing. Authorization is re-checked per mutation (the User must be
        a Member of the Item's List). Conflicts resolve last-write-wins per field, in
        order of server receipt (clientTimestamp is recorded, never used for ordering).
        A delete wins over concurrent edits: editing a removed Item is rejected with
        item_deleted and does not bring it back. A List holds at most the configured
        limit of Items (default 500); the create past it is rejected with limit_exceeded.
        item_clear (Clear checked, one per Checked Item) removes the Item from its List
        and records it in the List's Item history; an Item that is not checked is
        rejected with item_not_checked, and clearing an Item already cleared is applied
        and records nothing more. One mutation's rejection never fails the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "200":
          description: One result per mutation, in request order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/sync/pull:
    get:
      operationId: pullChanges
      summary: Changes since a cursor, for Lists the signed-in User is a Member of
      description: >-
        Returns the current state of every Item changed since the cursor, the Item
        history entries recorded since it (a List that becomes visible brings its whole
        Item history), plus tombstones for Items removed and for Lists the User can no
        longer see (deleted, or the User stopped being a Member). Omit cursor for a full
        snapshot. Keep pulling with the returned cursor while hasMore is true.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous pull.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: Changes since the cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/lists/{listId}/invitations:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: listListInvitations
      summary: The List's open Invitations (Owner only)
      description: >-
        Invitations not yet accepted, declined or cancelled: pending ones, and expired
        ones (status expired), so the Owner sees who never joined. Cancelling an
        expired Invitation removes it from here. Newest first.
      responses:
        "200":
          description: The List's open Invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitations"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createInvitation
      summary: Invite an email address to the List as an Editor (Owner only)
      description: >-
        Sends one email, in the given language, with the Invitation's deep link
        (https://cesta.tsantana.dev/invite/<token>). The token is single-use and only
        its hash is stored; the Invitation expires 14 days after it is created. A User
        can send at most 20 Invitations in any 24 hours; the next is rejected with
        limit_exceeded. An address that already belongs to a Member of the List (the
        Owner included) is rejected with already_member, and doesn't count toward the
        limit. If the email can't be sent, no Invitation is made and the request fails
        with email_not_sent (502); it can be retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The new Invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/EmailNotSent"
  /api/lists/{listId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      operationId: cancelInvitation
      summary: Cancel a pending Invitation (Owner only)
      description: >-
        Its link stops working. Cancelling an Invitation already cancelled, or expired,
        returns it cancelled; one already accepted or declined is rejected with
        invitation_accepted or invitation_declined.
      responses:
        "200":
          description: The cancelled Invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/invitations:
    get:
      operationId: listMyInvitations
      summary: Pending Invitations addressed to the signed-in User's email
      description: Newest first. Accept or decline one by its id.
      responses:
        "200":
          description: The User's pending Invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitations"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/invitations/lookup:
    post:
      operationId: lookupInvitation
      summary: The Invitation a token belongs to, whatever its status
      description: >-
        For the accept screen opened from the deep link. Identified as in
        acceptInvitation; the token goes in the body so it stays out of URLs and logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRef"
      responses:
        "200":
          description: The Invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an Invitation, becoming an Editor of its List
      description: >-
        Identify the Invitation by its token (from the deep link; the signed-in User's
        email need not match the invited one) or by its id (only for an Invitation
        addressed to the signed-in User's email). A cancelled, declined or expired
        Invitation is rejected with a code saying which, and one whose List was deleted
        with list_deleted. The token is single-use: once accepted, only a retry by the
        same User succeeds (and changes nothing). A List has at most 20 Members; joining
        a full List is rejected with list_full.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRef"
      responses:
        "200":
          description: The List the User is now a Member of
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/invitations/decline:
    post:
      operationId: declineInvitation
      summary: Decline an Invitation
      description: >-
        Identified as in acceptInvitation. Its link stops working. Declining twice
        returns it declined; a cancelled, expired or accepted Invitation is rejected
        with a code saying which.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRef"
      responses:
        "200":
          description: The declined Invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  parameters:
    ListId:
      name: listId
      in: path
      required: true
      description: The List's ID (a UUID chosen by the client that created it).
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: The Invitation's ID.
      schema:
        type: string
        format: uuid
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Firebase ID token for the signed-in User.
  responses:
    Unauthenticated:
      description: The bearer token is missing, malformed, expired or not trusted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Too many requests from this User or IP address; retry after the Retry-After header
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Only the List's Owner can do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: >-
        No such List, or the signed-in User is not a Member of it; or no such
        Invitation (see code)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The request conflicts with the List's state or a limit (see code)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    EmailNotSent:
      description: The email provider couldn't send the email (code email_not_sent); nothing was made
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable reason.
          enum:
            - unauthenticated
            - rate_limited
            - invalid_request
            - invalid_display_name
            - invalid_list_name
            - list_not_found
            - not_list_owner
            - list_deleted
            - list_id_taken
            - limit_exceeded
            - invalid_item
            - item_not_found
            - item_deleted
            - item_not_checked
            - invalid_email
            - invitation_not_found
            - invitation_cancelled
            - invitation_declined
            - invitation_expired
            - invitation_accepted
            - list_full
            - already_member
            - email_not_sent
            - internal
        message:
          type: string
          description: Human-readable explanation, in English, for logs and debugging.
        limit:
          type: integer
          minimum: 1
          description: >-
            Present when code is limit_exceeded or list_full: the maximum reached (Lists
            the User owns, Invitations they sent in 24 hours, or Members of the List).
    User:
      type: object
      required: [id, email, displayName, displayNameConfirmed]
      properties:
        id:
          type: string
          format: uuid
          description: Internal User ID.
        email:
          type: string
        displayName:
          type: string
          description: The name other Members see.
        displayNameConfirmed:
          type: boolean
          description: False until the User has set or confirmed their display name.
    UserUpdate:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: Trimmed; must contain at least one visible character.
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
    ListCreate:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: Chosen by the client, so the List can be created offline and retried safely.
        name:
          $ref: "#/components/schemas/ListName"
    ListRename:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/ListName"
    ListName:
      type: string
      minLength: 1
      maxLength: 60
      description: Trimmed; must contain at least one visible character and no control characters.
    Role:
      type: string
      enum: [owner, editor]
      description: The signed-in User's Role on the List.
    ListSummary:
      type: object
      required: [id, name, role, uncheckedItemCount, memberCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        uncheckedItemCount:
          type: integer
          minimum: 0
          description: Items on the List that are not checked.
        memberCount:
          type: integer
          minimum: 1
          description: Members of the List, including the Owner.
        createdAt:
          type: string
          format: date-time
    ListSummaries:
      type: object
      required: [lists]
      properties:
        lists:
          type: array
          items:
            $ref: "#/components/schemas/ListSummary"
    DeletedList:
      type: object
      required: [id, name, deletedAt, purgeAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        deletedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
          description: When the List stops being restorable and is removed for good (30 days after deletedAt).
    DeletedLists:
      type: object
      required: [lists]
      properties:
        lists:
          type: array
          items:
            $ref: "#/components/schemas/DeletedList"
    InvitationCreate:
      type: object
      required: [email, language]
      properties:
        email:
          type: string
          maxLength: 254
          description: The address to invite. Trimmed and lowercased.
        language:
          type: string
          enum: [en, pt-BR]
          description: The language of the email (the Owner's app language).
    InvitationRef:
      type: object
      description: Exactly one of token or id.
      properties:
        token:
          type: string
          description: The token from the Invitation's deep link.
        id:
          type: string
          format: uuid
          description: The Invitation's ID; only for one addressed to the signed-in User's email.
    InvitationStatus:
      type: string
      enum: [pending, accepted, declined, cancelled, expired]
    Invitation:
      type: object
      required: [id, listId, listName, email, invitedBy, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        listName:
          type: string
        email:
          type: string
          description: The invited address.
        invitedBy:
          $ref: "#/components/schemas/UserRef"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 14 days after createdAt.
    Invitations:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    ItemFields:
      type: object
      description: >-
        The fields a mutation sets. On item_update only the fields present change;
        sending null clears an optional field. checked true marks the Item bought by the
        pushing User at receipt time; false unchecks it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed; required on item_create and can't be cleared.
        quantity:
          type: string
          pattern: '^[0-9]{1,6}(\.[0-9]{1,3})?$'
          nullable: true
          description: A positive decimal as a string, to keep it exact (e.g. "1.5"). Zero is not allowed.
        unit:
          type: string
          # OpenAPI 3.0.3: a nullable enum must list null for null to be valid.
          enum: [un, kg, g, L, ml, pack, null]
          nullable: true
          description: Fixed set, not extendable. The app shows "un" as "units" in English.
        note:
          type: string
          maxLength: 200
          nullable: true
        checked:
          type: boolean
    Mutation:
      type: object
      required: [id, type, entityId, clientTimestamp]
      properties:
        id:
          type: string
          format: uuid
          description: Client mutation ID; retrying the same ID is safe.
        type:
          type: string
          enum: [item_create, item_update, item_delete, item_clear]
        entityId:
          type: string
          format: uuid
          description: The Item's ID, chosen by the client on item_create.
        listId:
          type: string
          format: uuid
          description: Required on item_create; ignored otherwise.
        fields:
          $ref: "#/components/schemas/ItemFields"
        clientTimestamp:
          type: string
          format: date-time
    PushRequest:
      type: object
      required: [mutations]
      properties:
        mutations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/Mutation"
    MutationResult:
      type: object
      required: [mutationId, status]
      properties:
        mutationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, rejected]
        reason:
          $ref: "#/components/schemas/ApiError"
    PushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MutationResult"
    Item:
      type: object
      required: [id, listId, name, addedBy, addedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: string
          pattern: '^[0-9]{1,6}(\.[0-9]{1,3})?$'
          nullable: true
          description: A positive decimal as a string, to keep it exact (e.g. "1.5"). Zero is not allowed.
        unit:
          type: string
          # OpenAPI 3.0.3: a nullable enum must list null for null to be valid.
          enum: [un, kg, g, L, ml, pack, null]
          nullable: true
          description: Fixed set, not extendable. The app shows "un" as "units" in English.
        note:
          type: string
          nullable: true
        addedBy:
          $ref: "#/components/schemas/UserRef"
        addedAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
          nullable: true
        checkedBy:
          type: object
          nullable: true
          required: [id, displayName]
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        updatedAt:
          type: string
          format: date-time
    HistoryEntry:
      type: object
      description: >-
        An Item that was bought: checked, then cleared from its List (Clear checked).
        One per cleared Item, identified by the Item's ID; entries never change.
      required: [itemId, listId, name, quantity, unit, note, clearedAt, clearedBy]
      properties:
        itemId:
          type: string
          format: uuid
          description: The cleared Item's ID.
        listId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: string
          pattern: '^[0-9]{1,6}(\.[0-9]{1,3})?$'
          nullable: true
        unit:
          type: string
          # OpenAPI 3.0.3: a nullable enum must list null for null to be valid.
          enum: [un, kg, g, L, ml, pack, null]
          nullable: true
        note:
          type: string
          nullable: true
        clearedAt:
          type: string
          format: date-time
        clearedBy:
          $ref: "#/components/schemas/UserRef"
    Tombstone:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [item, list]
          description: list means the User can no longer see the List; drop it and all its Items.
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
          description: Present when type is item.
    PullResponse:
      type: object
      required: [items, history, tombstones, cursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        history:
          type: array
          description: Item history entries recorded since the cursor.
          items:
            $ref: "#/components/schemas/HistoryEntry"
        tombstones:
          type: array
          items:
            $ref: "#/components/schemas/Tombstone"
        cursor:
          type: string
          description: Opaque; pass to the next pull.
        hasMore:
          type: boolean
